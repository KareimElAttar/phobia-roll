<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Phobia Roll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Rubik+Wet+Paint&display=swap">
<style>
:root {
  --bg: #f3ecee;
  --surface: #fbf7f8;
  --fg: #2a1a24;
  --muted: #6e5863;
  --line: #dccdd3;
  --accent: #a8324f;
  --accent-ink: #fff6f8;
  --ok: #4d6b22;
  --warn: #9a5b00;
  --font-display: "Rubik Wet Paint", Georgia, serif;
  --font-body: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1018;
    --surface: #261820;
    --fg: #f2e4e9;
    --muted: #b79ba7;
    --line: #3d2a34;
    --accent: #f08aa3;
    --accent-ink: #2a1018;
    --ok: #9bc25a;
    --warn: #e0a24a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100vh;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(48px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; }
.label { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(18px, 5vw, 32px); display: flex; flex-direction: column; gap: 22px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1.05; margin: 0; color: var(--accent); text-wrap: balance; }
.who { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dot[data-on="true"] { background: var(--accent); }
.prompt { margin: 0; font-size: clamp(1.1rem, 3.6vw, 1.3rem); font-style: italic; line-height: 1.5; text-wrap: pretty; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { font: inherit; text-align: left; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; cursor: pointer; min-height: 48px; }
.opt:hover { border-color: var(--accent); }
.link { font: inherit; font-size: 0.9rem; color: var(--muted); background: none; border: 0; padding: 4px 0; cursor: pointer; text-decoration: underline; align-self: flex-start; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.die-wrap { display: grid; place-items: center; padding: 8px 0; }
.die { width: 150px; height: 134px; background: var(--accent); clip-path: polygon(50% 0, 100% 100%, 0 100%); display: grid; place-items: end center; padding-bottom: 20px; color: var(--accent-ink); font-weight: 700; font-size: 2.6rem; font-variant-numeric: tabular-nums; }
.die.rolling { animation: tumble 0.45s linear infinite; }
@keyframes tumble { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .die.rolling { animation: none; } }
.go { font: inherit; font-weight: 700; font-size: 1.05rem; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 10px; padding: 14px 18px; cursor: pointer; min-height: 48px; }
.go[disabled] { opacity: 0.6; cursor: default; }
.result { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.result .die { width: 96px; height: 86px; font-size: 1.7rem; padding-bottom: 12px; }
.phobia { margin: 0; font-size: clamp(1.5rem, 6vw, 2.1rem); font-weight: 700; line-height: 1.15; text-wrap: balance; }
.rule { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; display: flex; flex-direction: column; gap: 6px; }
.rule p { margin: 0; }
.fine { margin: 0; font-size: 0.88rem; color: var(--muted); }
.msg { margin: 0; }
.paste { display: flex; flex-direction: column; gap: 10px; }
.paste input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; }
.dm { display: flex; flex-direction: column; gap: 12px; }
.dm-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.card h2 { margin: 0; font-size: 1.15rem; }
.chip { font-size: 0.8rem; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.chip[data-s="rolled"] { color: var(--ok); border-color: var(--ok); }
.card .small { font-size: 0.88rem; color: var(--muted); margin: 0; }
.rolled-line { display: flex; gap: 12px; align-items: flex-start; }
.rolled-line .die { width: 44px; height: 40px; font-size: 0.95rem; padding-bottom: 5px; flex: none; }
.rolled-line div { min-width: 0; }
.rolled-line strong { display: block; }
.rolled-line span { font-size: 0.9rem; color: var(--muted); }
details { font-size: 0.9rem; }
summary { cursor: pointer; color: var(--muted); }
details ol { margin: 8px 0 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
details li[data-hit="true"] { font-weight: 700; color: var(--accent); }
details li span { display: block; font-weight: 400; color: var(--muted); font-size: 0.85rem; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.mini { font: inherit; font-size: 0.85rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.mini.danger { color: var(--warn); border-color: var(--warn); }
</style>
</head>
<body>
<div class="wrap"><main id="app"></main></div>
<noscript><p style="max-width:720px;margin:24px auto">This page needs JavaScript.</p></noscript>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
